<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  
    <defs>
      <radialGradient id="studio-pedestal-top-049" cx="50%" cy="48%" r="62%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
        <stop offset="65%" stop-color="#EDE9DF" stop-opacity="0.6"/>
        <stop offset="100%" stop-color="#DDD6C7" stop-opacity="0.9"/>
      </radialGradient>
      
      <!-- Multi-tier soft realistic contact shadow -->
      <filter id="shadow-ambient-top-049" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
        <feOffset dx="0" dy="18" result="offsetblur"/>
        <feFlood flood-color="#14110E" flood-opacity="0.14"/>
        <feComposite in2="offsetblur" operator="in"/>
        <feMerge>
          <feMergeNode/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>

      <!-- Fine Texture Patterns -->
      <pattern id="pat-denim-top-049" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="6" stroke="#FFFFFF" stroke-width="0.8" opacity="0.18"/>
        <line x1="3" y1="0" x2="3" y2="6" stroke="#000000" stroke-width="0.6" opacity="0.12"/>
      </pattern>

      <pattern id="pat-waffle-top-049" width="8" height="8" patternUnits="userSpaceOnUse">
        <rect width="8" height="8" fill="none"/>
        <path d="M 0 0 L 8 0 L 8 8 L 0 8 Z" fill="none" stroke="#000000" stroke-width="0.75" opacity="0.15"/>
        <path d="M 2 2 L 6 2 L 6 6 L 2 6 Z" fill="#000000" opacity="0.08"/>
      </pattern>

      <pattern id="pat-knit-top-049" width="10" height="12" patternUnits="userSpaceOnUse">
        <path d="M 2 0 Q 5 6 2 12 M 8 0 Q 5 6 8 12" fill="none" stroke="#000000" stroke-width="0.8" opacity="0.16"/>
      </pattern>

      <pattern id="pat-corduroy-top-049" width="6" height="600" patternUnits="userSpaceOnUse">
        <rect x="0" y="0" width="3" height="600" fill="#FFFFFF" opacity="0.1"/>
        <rect x="3" y="0" width="3" height="600" fill="#000000" opacity="0.15"/>
      </pattern>
    </defs>

    <!-- Seamless Studio Backdrop -->
    <rect width="600" height="600" fill="#F5F3ED"/>
    <rect width="600" height="600" fill="url(#studio-pedestal-top-049)"/>

    <!-- Dual Ground Contact Shadows -->
    <ellipse cx="300" cy="525" rx="180" ry="22" fill="#14110E" opacity="0.08" filter="blur(10px)"/>
    <ellipse cx="300" cy="522" rx="140" ry="14" fill="#14110E" opacity="0.16" filter="blur(4px)"/>
  
  
          <!-- MA-1 Bomber Jacket -->
          <g filter="url(#shadow-ambient-top-049)">
            <!-- Ribbed Hem Band -->
            <rect x="180" y="445" width="240" height="32" rx="4" fill="#080706" stroke="#2C2A27" stroke-width="2"/>
            <!-- Main Bomber Body -->
            <path d="M 195 160 L 110 225 L 140 280 L 180 255 L 180 445 L 420 445 L 420 255 L 460 280 L 490 225 L 405 160 Z" 
                  fill="#1C1A18" stroke="#2C2A27" stroke-width="3" stroke-linejoin="round"/>
            <!-- Center Heavy Metal Zipper -->
            <line x1="300" y1="185" x2="300" y2="475" stroke="#94A3B8" stroke-width="4"/>
            <rect x="296" y="240" width="8" height="16" rx="2" fill="#E2E8F0" stroke="#475569" stroke-width="1.5"/>
            <!-- Ribbed Collar -->
            <path d="M 235 160 Q 300 200 365 160 Q 300 178 235 160 Z" fill="#080706" stroke="#2C2A27" stroke-width="2.5"/>
            <!-- Diagonal Welt Pockets with Snaps -->
            <line x1="225" y1="380" x2="265" y2="415" stroke="#2C2A27" stroke-width="3"/>
            <circle cx="245" cy="397" r="3.5" fill="#CBD5E1"/>
            <line x1="375" y1="380" x2="335" y2="415" stroke="#2C2A27" stroke-width="3"/>
            <circle cx="355" cy="397" r="3.5" fill="#CBD5E1"/>
            <!-- Sleeve Zipper Utility Pocket (Left Sleeve) -->
            <rect x="125" y="245" width="22" height="28" rx="2" fill="#100F0E" stroke="#2C2A27" stroke-width="1.8"/>
            <line x1="136" y1="245" x2="136" y2="273" stroke="#94A3B8" stroke-width="2"/>
            <!-- Red Flight Ribbon Tag -->
            <rect x="133" y="270" width="6" height="24" rx="1" fill="#DC2626"/>
            <!-- Ribbed Cuffs -->
            <polygon points="110,225 140,280 152,272 122,217" fill="#080706" stroke="#2C2A27" stroke-width="1.8"/>
            <polygon points="490,225 460,280 448,272 478,217" fill="#080706" stroke="#2C2A27" stroke-width="1.8"/>
          </g>
        
</svg>