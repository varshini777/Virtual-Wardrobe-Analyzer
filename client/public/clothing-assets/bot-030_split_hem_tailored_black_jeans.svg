<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  
    <defs>
      <radialGradient id="studio-pedestal-bot-030" cx="50%" cy="48%" r="62%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
        <stop offset="65%" stop-color="#EDE9DF" stop-opacity="0.6"/>
        <stop offset="100%" stop-color="#DDD6C7" stop-opacity="0.9"/>
      </radialGradient>
      
      <!-- Multi-tier soft realistic contact shadow -->
      <filter id="shadow-ambient-bot-030" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
        <feOffset dx="0" dy="18" result="offsetblur"/>
        <feFlood flood-color="#14110E" flood-opacity="0.14"/>
        <feComposite in2="offsetblur" operator="in"/>
        <feMerge>
          <feMergeNode/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>

      <!-- Fine Texture Patterns -->
      <pattern id="pat-denim-bot-030" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="6" stroke="#FFFFFF" stroke-width="0.8" opacity="0.18"/>
        <line x1="3" y1="0" x2="3" y2="6" stroke="#000000" stroke-width="0.6" opacity="0.12"/>
      </pattern>

      <pattern id="pat-waffle-bot-030" width="8" height="8" patternUnits="userSpaceOnUse">
        <rect width="8" height="8" fill="none"/>
        <path d="M 0 0 L 8 0 L 8 8 L 0 8 Z" fill="none" stroke="#000000" stroke-width="0.75" opacity="0.15"/>
        <path d="M 2 2 L 6 2 L 6 6 L 2 6 Z" fill="#000000" opacity="0.08"/>
      </pattern>

      <pattern id="pat-knit-bot-030" width="10" height="12" patternUnits="userSpaceOnUse">
        <path d="M 2 0 Q 5 6 2 12 M 8 0 Q 5 6 8 12" fill="none" stroke="#000000" stroke-width="0.8" opacity="0.16"/>
      </pattern>

      <pattern id="pat-corduroy-bot-030" width="6" height="600" patternUnits="userSpaceOnUse">
        <rect x="0" y="0" width="3" height="600" fill="#FFFFFF" opacity="0.1"/>
        <rect x="3" y="0" width="3" height="600" fill="#000000" opacity="0.15"/>
      </pattern>
    </defs>

    <!-- Seamless Studio Backdrop -->
    <rect width="600" height="600" fill="#F5F3ED"/>
    <rect width="600" height="600" fill="url(#studio-pedestal-bot-030)"/>

    <!-- Dual Ground Contact Shadows -->
    <ellipse cx="300" cy="525" rx="180" ry="22" fill="#14110E" opacity="0.08" filter="blur(10px)"/>
    <ellipse cx="300" cy="522" rx="140" ry="14" fill="#14110E" opacity="0.16" filter="blur(4px)"/>
  
  
        <g filter="url(#shadow-ambient-bot-030)">
          <!-- Pant Silhouette (Wide or Tapered) -->
          <path d="M 220 160 L 380 160 L 365 490 L 312 490 L 300 270 L 288 490 L 235 490 Z" 
                fill="#1C1A18" stroke="#2C2A27" stroke-width="3" stroke-linejoin="round"/>
          <rect x="220" y="190" width="160" height="300" fill="url(#pat-denim-bot-030)"/>

          <!-- Waistband Area -->
          <rect x="220" y="160" width="160" height="28" fill="#100F0E" stroke="#2C2A27" stroke-width="2"/>

          

          
            <!-- Authentic 5-Pocket Scoop and Copper Rivets -->
            <path d="M 235 188 Q 260 215 275 188" fill="none" stroke="#B87333" stroke-width="2"/>
            <path d="M 365 188 Q 340 215 325 188" fill="none" stroke="#B87333" stroke-width="2"/>
            <circle cx="236" cy="190" r="2.5" fill="#B87333"/>
            <circle cx="364" cy="190" r="2.5" fill="#B87333"/>
            <line x1="222" y1="188" x2="378" y2="188" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="3,3"/>
          

          
        </g>
      
</svg>