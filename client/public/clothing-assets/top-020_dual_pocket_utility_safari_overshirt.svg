<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  
    <defs>
      <radialGradient id="studio-pedestal-top-020" cx="50%" cy="48%" r="62%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
        <stop offset="65%" stop-color="#EDE9DF" stop-opacity="0.6"/>
        <stop offset="100%" stop-color="#DDD6C7" stop-opacity="0.9"/>
      </radialGradient>
      
      <!-- Multi-tier soft realistic contact shadow -->
      <filter id="shadow-ambient-top-020" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
        <feOffset dx="0" dy="18" result="offsetblur"/>
        <feFlood flood-color="#14110E" flood-opacity="0.14"/>
        <feComposite in2="offsetblur" operator="in"/>
        <feMerge>
          <feMergeNode/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>

      <!-- Fine Texture Patterns -->
      <pattern id="pat-denim-top-020" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="6" stroke="#FFFFFF" stroke-width="0.8" opacity="0.18"/>
        <line x1="3" y1="0" x2="3" y2="6" stroke="#000000" stroke-width="0.6" opacity="0.12"/>
      </pattern>

      <pattern id="pat-waffle-top-020" width="8" height="8" patternUnits="userSpaceOnUse">
        <rect width="8" height="8" fill="none"/>
        <path d="M 0 0 L 8 0 L 8 8 L 0 8 Z" fill="none" stroke="#000000" stroke-width="0.75" opacity="0.15"/>
        <path d="M 2 2 L 6 2 L 6 6 L 2 6 Z" fill="#000000" opacity="0.08"/>
      </pattern>

      <pattern id="pat-knit-top-020" width="10" height="12" patternUnits="userSpaceOnUse">
        <path d="M 2 0 Q 5 6 2 12 M 8 0 Q 5 6 8 12" fill="none" stroke="#000000" stroke-width="0.8" opacity="0.16"/>
      </pattern>

      <pattern id="pat-corduroy-top-020" width="6" height="600" patternUnits="userSpaceOnUse">
        <rect x="0" y="0" width="3" height="600" fill="#FFFFFF" opacity="0.1"/>
        <rect x="3" y="0" width="3" height="600" fill="#000000" opacity="0.15"/>
      </pattern>
    </defs>

    <!-- Seamless Studio Backdrop -->
    <rect width="600" height="600" fill="#F5F3ED"/>
    <rect width="600" height="600" fill="url(#studio-pedestal-top-020)"/>

    <!-- Dual Ground Contact Shadows -->
    <ellipse cx="300" cy="525" rx="180" ry="22" fill="#14110E" opacity="0.08" filter="blur(10px)"/>
    <ellipse cx="300" cy="522" rx="140" ry="14" fill="#14110E" opacity="0.16" filter="blur(4px)"/>
  
  
        <!-- High Fashion Dress / Casual Shirt -->
        <g filter="url(#shadow-ambient-top-020)">
          <path d="M 220 140 L 150 195 L 180 250 L 215 225 L 215 480 Q 300 495 385 480 L 385 225 L 420 250 L 450 195 L 380 140 Z" 
                fill="#BDA88D" stroke="#6A5A41" stroke-width="2.5" stroke-linejoin="round"/>
          
            <!-- Crisp Rolled Collar -->
            <path d="M 240 140 L 300 170 L 360 140 L 335 125 L 300 135 L 265 125 Z" fill="#BDA88D" stroke="#6A5A41" stroke-width="2.2"/>
          

          
            <!-- Dual Bellows Cargo Chest Pockets -->
            <rect x="230" y="230" width="55" height="60" rx="3" fill="#BDA88D" stroke="#6A5A41" stroke-width="2"/>
            <polygon points="228,230 287,230 258,245" fill="#A18D72" stroke="#6A5A41" stroke-width="1.8"/>
            <rect x="315" y="230" width="55" height="60" rx="3" fill="#BDA88D" stroke="#6A5A41" stroke-width="2"/>
            <polygon points="313,230 372,230 343,245" fill="#A18D72" stroke="#6A5A41" stroke-width="1.8"/>
          

          <!-- Center Placket & Pearl Buttons -->
          <line x1="300" y1="165" x2="300" y2="488" stroke="#6A5A41" stroke-width="2.5"/>
          
            <circle cx="300" cy="205" r="3.5" fill="#FAF8F5" stroke="#6A5A41" stroke-width="1"/>
          
            <circle cx="300" cy="250" r="3.5" fill="#FAF8F5" stroke="#6A5A41" stroke-width="1"/>
          
            <circle cx="300" cy="295" r="3.5" fill="#FAF8F5" stroke="#6A5A41" stroke-width="1"/>
          
            <circle cx="300" cy="340" r="3.5" fill="#FAF8F5" stroke="#6A5A41" stroke-width="1"/>
          
            <circle cx="300" cy="385" r="3.5" fill="#FAF8F5" stroke="#6A5A41" stroke-width="1"/>
          
            <circle cx="300" cy="430" r="3.5" fill="#FAF8F5" stroke="#6A5A41" stroke-width="1"/>
          
        </g>
      
</svg>