    </defs>
    <!-- Sleeveless Vest Body -->
    <path d="M 230 145 L 210 240 L 215 470 L 385 470 L 390 240 L 370 145 Z" fill="url(#nehruGrad)" stroke="#431407" stroke-width="2"/>
