<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  
    <defs>
      <radialGradient id="studio-pedestal-top-051" cx="50%" cy="48%" r="62%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
        <stop offset="65%" stop-color="#EDE9DF" stop-opacity="0.6"/>
        <stop offset="100%" stop-color="#DDD6C7" stop-opacity="0.9"/>
      </radialGradient>
      
      <!-- Multi-tier soft realistic contact shadow -->
      <filter id="shadow-ambient-top-051" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
        <feOffset dx="0" dy="18" result="offsetblur"/>
        <feFlood flood-color="#14110E" flood-opacity="0.14"/>
        <feComposite in2="offsetblur" operator="in"/>
        <feMerge>
          <feMergeNode/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>

      <!-- Fine Texture Patterns -->
      <pattern id="pat-denim-top-051" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="6" stroke="#FFFFFF" stroke-width="0.8" opacity="0.18"/>
        <line x1="3" y1="0" x2="3" y2="6" stroke="#000000" stroke-width="0.6" opacity="0.12"/>
      </pattern>

      <pattern id="pat-waffle-top-051" width="8" height="8" patternUnits="userSpaceOnUse">
        <rect width="8" height="8" fill="none"/>
        <path d="M 0 0 L 8 0 L 8 8 L 0 8 Z" fill="none" stroke="#000000" stroke-width="0.75" opacity="0.15"/>
        <path d="M 2 2 L 6 2 L 6 6 L 2 6 Z" fill="#000000" opacity="0.08"/>
      </pattern>

      <pattern id="pat-knit-top-051" width="10" height="12" patternUnits="userSpaceOnUse">
        <path d="M 2 0 Q 5 6 2 12 M 8 0 Q 5 6 8 12" fill="none" stroke="#000000" stroke-width="0.8" opacity="0.16"/>
      </pattern>

      <pattern id="pat-corduroy-top-051" width="6" height="600" patternUnits="userSpaceOnUse">
        <rect x="0" y="0" width="3" height="600" fill="#FFFFFF" opacity="0.1"/>
        <rect x="3" y="0" width="3" height="600" fill="#000000" opacity="0.15"/>
      </pattern>
    </defs>

    <!-- Seamless Studio Backdrop -->
    <rect width="600" height="600" fill="#F5F3ED"/>
    <rect width="600" height="600" fill="url(#studio-pedestal-top-051)"/>

    <!-- Dual Ground Contact Shadows -->
    <ellipse cx="300" cy="525" rx="180" ry="22" fill="#14110E" opacity="0.08" filter="blur(10px)"/>
    <ellipse cx="300" cy="522" rx="140" ry="14" fill="#14110E" opacity="0.16" filter="blur(4px)"/>
  
  
          <!-- Double-Breasted Heritage Trench Coat -->
          <g filter="url(#shadow-ambient-top-051)">
            <!-- Full Length Body -->
            <path d="M 210 140 L 125 195 L 155 250 L 195 230 L 195 505 Q 300 520 405 505 L 405 230 L 445 250 L 475 195 L 390 140 Z" 
                  fill="#DDD2C3" stroke="#8F816F" stroke-width="3" stroke-linejoin="round"/>
            <!-- Wide Revere Trench Collar -->
            <polygon points="210,140 255,230 225,235 270,300 210,200" fill="#DDD2C3" stroke="#8F816F" stroke-width="2.5"/>
            <polygon points="390,140 345,230 375,235 330,300 390,200" fill="#DDD2C3" stroke="#8F816F" stroke-width="2.5"/>
            <!-- Storm Flap (Gun Flap) Right Shoulder -->
            <polygon points="220,165 285,190 280,260 215,225" fill="#C2B5A3" stroke="#8F816F" stroke-width="2"/>
            <circle cx="280" cy="252" r="3" fill="#1C1815"/>
            <!-- Double Breasted 10-Button Grid -->
            
              <circle cx="270" cy="230" r="4.5" fill="#1C1815" stroke="#8F816F" stroke-width="1"/>
              <circle cx="330" cy="230" r="4.5" fill="#1C1815" stroke="#8F816F" stroke-width="1"/>
            
              <circle cx="270" cy="280" r="4.5" fill="#1C1815" stroke="#8F816F" stroke-width="1"/>
              <circle cx="330" cy="280" r="4.5" fill="#1C1815" stroke="#8F816F" stroke-width="1"/>
            
              <circle cx="270" cy="330" r="4.5" fill="#1C1815" stroke="#8F816F" stroke-width="1"/>
              <circle cx="330" cy="330" r="4.5" fill="#1C1815" stroke="#8F816F" stroke-width="1"/>
            
              <circle cx="270" cy="380" r="4.5" fill="#1C1815" stroke="#8F816F" stroke-width="1"/>
              <circle cx="330" cy="380" r="4.5" fill="#1C1815" stroke="#8F816F" stroke-width="1"/>
            
            <!-- Wide Waist Belt with D-Rings -->
            <rect x="190" y="340" width="220" height="22" fill="#C2B5A3" stroke="#8F816F" stroke-width="2"/>
            <rect x="285" y="336" width="30" height="30" rx="3" fill="none" stroke="#D4AF37" stroke-width="3"/>
            <!-- Sleeve Tightening Straps -->
            <rect x="135" y="240" width="16" height="8" rx="1" fill="#D4AF37"/>
            <rect x="445" y="240" width="16" height="8" rx="1" fill="#D4AF37"/>
          </g>
        
</svg>