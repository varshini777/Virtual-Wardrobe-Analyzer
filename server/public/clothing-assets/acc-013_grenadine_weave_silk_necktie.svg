<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  
    <defs>
      <radialGradient id="studio-pedestal-acc-013" cx="50%" cy="48%" r="62%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
        <stop offset="65%" stop-color="#EDE9DF" stop-opacity="0.6"/>
        <stop offset="100%" stop-color="#DDD6C7" stop-opacity="0.9"/>
      </radialGradient>
      
      <!-- Multi-tier soft realistic contact shadow -->
      <filter id="shadow-ambient-acc-013" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
        <feOffset dx="0" dy="18" result="offsetblur"/>
        <feFlood flood-color="#14110E" flood-opacity="0.14"/>
        <feComposite in2="offsetblur" operator="in"/>
        <feMerge>
          <feMergeNode/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>

      <!-- Fine Texture Patterns -->
      <pattern id="pat-denim-acc-013" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="6" stroke="#FFFFFF" stroke-width="0.8" opacity="0.18"/>
        <line x1="3" y1="0" x2="3" y2="6" stroke="#000000" stroke-width="0.6" opacity="0.12"/>
      </pattern>

      <pattern id="pat-waffle-acc-013" width="8" height="8" patternUnits="userSpaceOnUse">
        <rect width="8" height="8" fill="none"/>
        <path d="M 0 0 L 8 0 L 8 8 L 0 8 Z" fill="none" stroke="#000000" stroke-width="0.75" opacity="0.15"/>
        <path d="M 2 2 L 6 2 L 6 6 L 2 6 Z" fill="#000000" opacity="0.08"/>
      </pattern>

      <pattern id="pat-knit-acc-013" width="10" height="12" patternUnits="userSpaceOnUse">
        <path d="M 2 0 Q 5 6 2 12 M 8 0 Q 5 6 8 12" fill="none" stroke="#000000" stroke-width="0.8" opacity="0.16"/>
      </pattern>

      <pattern id="pat-corduroy-acc-013" width="6" height="600" patternUnits="userSpaceOnUse">
        <rect x="0" y="0" width="3" height="600" fill="#FFFFFF" opacity="0.1"/>
        <rect x="3" y="0" width="3" height="600" fill="#000000" opacity="0.15"/>
      </pattern>
    </defs>

    <!-- Seamless Studio Backdrop -->
    <rect width="600" height="600" fill="#F5F3ED"/>
    <rect width="600" height="600" fill="url(#studio-pedestal-acc-013)"/>

    <!-- Dual Ground Contact Shadows -->
    <ellipse cx="300" cy="525" rx="180" ry="22" fill="#14110E" opacity="0.08" filter="blur(10px)"/>
    <ellipse cx="300" cy="522" rx="140" ry="14" fill="#14110E" opacity="0.16" filter="blur(4px)"/>
  
  
        <!-- Sartorial Silk Necktie -->
        <g filter="url(#shadow-ambient-acc-013)">
          <polygon points="280,160 320,160 310,195 290,195" fill="#4D1723" stroke="#672432" stroke-width="2.2"/>
          <polygon points="290,195 310,195 330,440 300,480 270,440" fill="#4D1723" stroke="#672432" stroke-width="2.5"/>
          <polygon points="290,195 300,195 300,480 270,440" fill="#340C16" opacity="0.35"/>
          <!-- Dimple at the knot -->
          <ellipse cx="300" cy="198" rx="4" ry="2" fill="#000000" opacity="0.4"/>
        </g>
      
</svg>