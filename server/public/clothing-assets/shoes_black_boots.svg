<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#e9ecef"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="leather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="60%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="490" rx="190" ry="22" fill="#000000" opacity="0.09"/>
  <g filter="url(#shadow)">
    <!-- Chelsea Boot Pair (Left & Right) -->
    <!-- Boot Body -->
    <path d="M 170 210 L 250 210 L 255 330 C 270 340 310 380 440 405 C 445 425 435 445 420 445 L 140 445 C 130 425 140 360 160 300 Z" fill="url(#leather)" stroke="#3f3f46" stroke-width="2"/>
    <!-- Lug Sole & Heel -->
    <path d="M 135 440 L 425 440 L 420 465 L 140 465 Z" fill="#09090b" stroke="#18181b" stroke-width="2"/>
    <rect x="140" y="460" width="60" height="15" rx="3" fill="#09090b"/>
    <!-- Elastic Gusset Panel -->
    <path d="M 195 210 L 225 210 L 215 310 L 195 310 Z" fill="#0f172a" stroke="#27272a" stroke-width="1.5"/>
    <!-- Pull Tab -->
    <path d="M 160 210 Q 155 190 170 190 Q 175 210 170 210" fill="#3f3f46"/>
    <!-- Toe Cap Stitching Detail -->
    <path d="M 330 380 Q 360 410 415 415" stroke="#3f3f46" stroke-width="1.5" fill="none"/>
  </g>
</svg>
