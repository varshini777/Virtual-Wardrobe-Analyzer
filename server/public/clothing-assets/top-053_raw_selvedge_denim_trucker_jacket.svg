<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  
    <defs>
      <radialGradient id="studio-pedestal-top-053" cx="50%" cy="48%" r="62%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
        <stop offset="65%" stop-color="#EDE9DF" stop-opacity="0.6"/>
        <stop offset="100%" stop-color="#DDD6C7" stop-opacity="0.9"/>
      </radialGradient>
      
      <!-- Multi-tier soft realistic contact shadow -->
      <filter id="shadow-ambient-top-053" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
        <feOffset dx="0" dy="18" result="offsetblur"/>
        <feFlood flood-color="#14110E" flood-opacity="0.14"/>
        <feComposite in2="offsetblur" operator="in"/>
        <feMerge>
          <feMergeNode/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>

      <!-- Fine Texture Patterns -->
      <pattern id="pat-denim-top-053" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="6" stroke="#FFFFFF" stroke-width="0.8" opacity="0.18"/>
        <line x1="3" y1="0" x2="3" y2="6" stroke="#000000" stroke-width="0.6" opacity="0.12"/>
      </pattern>

      <pattern id="pat-waffle-top-053" width="8" height="8" patternUnits="userSpaceOnUse">
        <rect width="8" height="8" fill="none"/>
        <path d="M 0 0 L 8 0 L 8 8 L 0 8 Z" fill="none" stroke="#000000" stroke-width="0.75" opacity="0.15"/>
        <path d="M 2 2 L 6 2 L 6 6 L 2 6 Z" fill="#000000" opacity="0.08"/>
      </pattern>

      <pattern id="pat-knit-top-053" width="10" height="12" patternUnits="userSpaceOnUse">
        <path d="M 2 0 Q 5 6 2 12 M 8 0 Q 5 6 8 12" fill="none" stroke="#000000" stroke-width="0.8" opacity="0.16"/>
      </pattern>

      <pattern id="pat-corduroy-top-053" width="6" height="600" patternUnits="userSpaceOnUse">
        <rect x="0" y="0" width="3" height="600" fill="#FFFFFF" opacity="0.1"/>
        <rect x="3" y="0" width="3" height="600" fill="#000000" opacity="0.15"/>
      </pattern>
    </defs>

    <!-- Seamless Studio Backdrop -->
    <rect width="600" height="600" fill="#F5F3ED"/>
    <rect width="600" height="600" fill="url(#studio-pedestal-top-053)"/>

    <!-- Dual Ground Contact Shadows -->
    <ellipse cx="300" cy="525" rx="180" ry="22" fill="#14110E" opacity="0.08" filter="blur(10px)"/>
    <ellipse cx="300" cy="522" rx="140" ry="14" fill="#14110E" opacity="0.16" filter="blur(4px)"/>
  
  
          <!-- Type III Denim Trucker Jacket -->
          <g filter="url(#shadow-ambient-top-053)">
            <path d="M 215 150 L 130 205 L 160 260 L 200 235 L 200 455 L 400 455 L 400 235 L 440 260 L 470 205 L 385 150 Z" 
                  fill="#1F314D" stroke="#2E476F" stroke-width="3" stroke-linejoin="round"/>
            <rect x="200" y="180" width="200" height="275" fill="url(#pat-denim-top-053)"/>
            <!-- Pointed Western Collar -->
            <path d="M 235 150 L 300 180 L 365 150 L 340 135 L 300 145 L 260 135 Z" fill="#142135" stroke="#2E476F" stroke-width="2.5"/>
            <!-- Type III Pointed Flap Pockets -->
            <path d="M 225 240 L 275 240 L 275 285 L 250 298 L 225 285 Z" fill="#1F314D" stroke="#2E476F" stroke-width="2"/>
            <circle cx="250" cy="255" r="3.5" fill="#B87333"/>
            <path d="M 325 240 L 375 240 L 375 285 L 350 298 L 325 285 Z" fill="#1F314D" stroke="#2E476F" stroke-width="2"/>
            <circle cx="350" cy="255" r="3.5" fill="#B87333"/>
            <!-- Vertical V-Seams to Hem -->
            <line x1="250" y1="298" x2="270" y2="455" stroke="#D4AF37" stroke-width="1.8" stroke-dasharray="3,3"/>
            <line x1="350" y1="298" x2="330" y2="455" stroke="#D4AF37" stroke-width="1.8" stroke-dasharray="3,3"/>
            <!-- Metal Shank Buttons down Placket -->
            
              <circle cx="300" cy="200" r="4" fill="#B87333" stroke="#5C3818" stroke-width="1.2"/>
            
              <circle cx="300" cy="250" r="4" fill="#B87333" stroke="#5C3818" stroke-width="1.2"/>
            
              <circle cx="300" cy="300" r="4" fill="#B87333" stroke="#5C3818" stroke-width="1.2"/>
            
              <circle cx="300" cy="350" r="4" fill="#B87333" stroke="#5C3818" stroke-width="1.2"/>
            
              <circle cx="300" cy="400" r="4" fill="#B87333" stroke="#5C3818" stroke-width="1.2"/>
            
              <circle cx="300" cy="440" r="4" fill="#B87333" stroke="#5C3818" stroke-width="1.2"/>
            
          </g>
        
</svg>