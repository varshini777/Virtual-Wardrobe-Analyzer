<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#e9ecef"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="khakifabric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ded0b6"/>
      <stop offset="50%" stop-color="#c9b99a"/>
      <stop offset="100%" stop-color="#b8a786"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="510" rx="160" ry="20" fill="#000000" opacity="0.08"/>
  <g filter="url(#shadow)">
    <!-- Main Shorts Body -->
    <path d="M 190 180 L 410 180 L 425 430 L 325 430 L 300 290 L 275 430 L 175 430 Z" fill="url(#khakifabric)" stroke="#a89876" stroke-width="2"/>
    <!-- Waistband & Belt Loops -->
    <rect x="188" y="180" width="224" height="30" fill="#bfae8f" stroke="#a89876" stroke-width="1.5"/>
    <rect x="220" y="180" width="6" height="30" fill="#9e8e6e"/>
    <rect x="260" y="180" width="6" height="30" fill="#9e8e6e"/>
    <rect x="334" y="180" width="6" height="30" fill="#9e8e6e"/>
    <rect x="374" y="180" width="6" height="30" fill="#9e8e6e"/>
    <!-- Front Fly & Button -->
    <line x1="300" y1="210" x2="300" y2="280" stroke="#a89876" stroke-width="2"/>
    <path d="M 300 280 C 315 280 320 260 320 230" fill="none" stroke="#a89876" stroke-width="1.5"/>
    <circle cx="300" cy="195" r="4.5" fill="#786a4e"/>
    <!-- Slanted Pockets -->
    <line x1="205" y1="210" x2="235" y2="290" stroke="#a89876" stroke-width="2"/>
    <line x1="395" y1="210" x2="365" y2="290" stroke="#a89876" stroke-width="2"/>
    <!-- Bottom Hem Cuffs -->
    <line x1="175" y1="410" x2="275" y2="410" stroke="#a89876" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="325" y1="410" x2="425" y2="410" stroke="#a89876" stroke-width="1.5" stroke-dasharray="4,3"/>
  </g>
</svg>
