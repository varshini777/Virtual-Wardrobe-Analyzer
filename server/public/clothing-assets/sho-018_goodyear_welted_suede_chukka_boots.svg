<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  
    <defs>
      <radialGradient id="studio-pedestal-sho-018" cx="50%" cy="48%" r="62%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
        <stop offset="65%" stop-color="#EDE9DF" stop-opacity="0.6"/>
        <stop offset="100%" stop-color="#DDD6C7" stop-opacity="0.9"/>
      </radialGradient>
      
      <!-- Multi-tier soft realistic contact shadow -->
      <filter id="shadow-ambient-sho-018" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
        <feOffset dx="0" dy="18" result="offsetblur"/>
        <feFlood flood-color="#14110E" flood-opacity="0.14"/>
        <feComposite in2="offsetblur" operator="in"/>
        <feMerge>
          <feMergeNode/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>

      <!-- Fine Texture Patterns -->
      <pattern id="pat-denim-sho-018" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="6" stroke="#FFFFFF" stroke-width="0.8" opacity="0.18"/>
        <line x1="3" y1="0" x2="3" y2="6" stroke="#000000" stroke-width="0.6" opacity="0.12"/>
      </pattern>

      <pattern id="pat-waffle-sho-018" width="8" height="8" patternUnits="userSpaceOnUse">
        <rect width="8" height="8" fill="none"/>
        <path d="M 0 0 L 8 0 L 8 8 L 0 8 Z" fill="none" stroke="#000000" stroke-width="0.75" opacity="0.15"/>
        <path d="M 2 2 L 6 2 L 6 6 L 2 6 Z" fill="#000000" opacity="0.08"/>
      </pattern>

      <pattern id="pat-knit-sho-018" width="10" height="12" patternUnits="userSpaceOnUse">
        <path d="M 2 0 Q 5 6 2 12 M 8 0 Q 5 6 8 12" fill="none" stroke="#000000" stroke-width="0.8" opacity="0.16"/>
      </pattern>

      <pattern id="pat-corduroy-sho-018" width="6" height="600" patternUnits="userSpaceOnUse">
        <rect x="0" y="0" width="3" height="600" fill="#FFFFFF" opacity="0.1"/>
        <rect x="3" y="0" width="3" height="600" fill="#000000" opacity="0.15"/>
      </pattern>
    </defs>

    <!-- Seamless Studio Backdrop -->
    <rect width="600" height="600" fill="#F5F3ED"/>
    <rect width="600" height="600" fill="url(#studio-pedestal-sho-018)"/>

    <!-- Dual Ground Contact Shadows -->
    <ellipse cx="300" cy="525" rx="180" ry="22" fill="#14110E" opacity="0.08" filter="blur(10px)"/>
    <ellipse cx="300" cy="522" rx="140" ry="14" fill="#14110E" opacity="0.16" filter="blur(4px)"/>
  
  
        <!-- High Ankle Boot Silhouette -->
        <g filter="url(#shadow-ambient-sho-018)">
          <!-- Ankle Shaft Extending Up -->
          <path d="M 210 270 L 290 270 L 330 350 Q 420 365 445 420 L 160 420 L 160 300 Q 185 280 210 270 Z" 
                fill="#C89B6A" stroke="#6D4A21" stroke-width="3" stroke-linejoin="round"/>
          <!-- Commando Lugged Rubber Sole -->
          <rect x="150" y="420" width="300" height="24" rx="3" fill="#14110E" stroke="#6D4A21" stroke-width="2"/>
          
            <rect x="160" y="438" width="16" height="6" fill="#000000"/>
          
            <rect x="190" y="438" width="16" height="6" fill="#000000"/>
          
            <rect x="220" y="438" width="16" height="6" fill="#000000"/>
          
            <rect x="250" y="438" width="16" height="6" fill="#000000"/>
          
            <rect x="280" y="438" width="16" height="6" fill="#000000"/>
          
            <rect x="310" y="438" width="16" height="6" fill="#000000"/>
          
            <rect x="340" y="438" width="16" height="6" fill="#000000"/>
          
            <rect x="370" y="438" width="16" height="6" fill="#000000"/>
          
            <rect x="400" y="438" width="16" height="6" fill="#000000"/>
          
            <rect x="430" y="438" width="16" height="6" fill="#000000"/>
          
          <rect x="160" y="444" width="70" height="16" rx="2" fill="#14110E"/>

          
            <!-- Combat / Work Boot Eyelets & Laces -->
            
              <circle cx="270" cy="290" r="3" fill="#D4AF37"/>
              <line x1="270" y1="290" x2="310" y2="302" stroke="#D4AF37" stroke-width="1.8"/>
            
              <circle cx="270" cy="315" r="3" fill="#D4AF37"/>
              <line x1="270" y1="315" x2="310" y2="327" stroke="#D4AF37" stroke-width="1.8"/>
            
              <circle cx="270" cy="340" r="3" fill="#D4AF37"/>
              <line x1="270" y1="340" x2="310" y2="352" stroke="#D4AF37" stroke-width="1.8"/>
            
              <circle cx="270" cy="365" r="3" fill="#D4AF37"/>
              <line x1="270" y1="365" x2="310" y2="377" stroke="#D4AF37" stroke-width="1.8"/>
            
          
        </g>
      
</svg>