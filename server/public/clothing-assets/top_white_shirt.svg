<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#e9ecef"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="fabric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="510" rx="170" ry="22" fill="#000000" opacity="0.08"/>
  <g filter="url(#shadow)">
    <!-- Main Shirt Body -->
    <path d="M 230 140 L 160 190 L 195 240 L 225 220 L 225 470 L 375 470 L 375 220 L 405 240 L 440 190 L 370 140 Z" fill="url(#fabric)" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Center Placket & Buttons -->
    <line x1="300" y1="160" x2="300" y2="470" stroke="#cbd5e1" stroke-width="2.5"/>
    <circle cx="300" cy="200" r="3.5" fill="#94a3b8"/>
    <circle cx="300" cy="250" r="3.5" fill="#94a3b8"/>
    <circle cx="300" cy="300" r="3.5" fill="#94a3b8"/>
    <circle cx="300" cy="350" r="3.5" fill="#94a3b8"/>
    <circle cx="300" cy="400" r="3.5" fill="#94a3b8"/>
    <circle cx="300" cy="445" r="3.5" fill="#94a3b8"/>
    <!-- Chest Pocket -->
    <path d="M 245 235 L 275 235 L 275 275 L 260 285 L 245 275 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Collar -->
    <path d="M 230 140 L 275 195 L 300 170 L 325 195 L 370 140 L 320 135 L 300 145 L 280 135 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  </g>
</svg>
