<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  
    <defs>
      <radialGradient id="studio-pedestal-acc-006" cx="50%" cy="48%" r="62%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
        <stop offset="65%" stop-color="#EDE9DF" stop-opacity="0.6"/>
        <stop offset="100%" stop-color="#DDD6C7" stop-opacity="0.9"/>
      </radialGradient>
      
      <!-- Multi-tier soft realistic contact shadow -->
      <filter id="shadow-ambient-acc-006" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
        <feOffset dx="0" dy="18" result="offsetblur"/>
        <feFlood flood-color="#14110E" flood-opacity="0.14"/>
        <feComposite in2="offsetblur" operator="in"/>
        <feMerge>
          <feMergeNode/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>

      <!-- Fine Texture Patterns -->
      <pattern id="pat-denim-acc-006" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="6" stroke="#FFFFFF" stroke-width="0.8" opacity="0.18"/>
        <line x1="3" y1="0" x2="3" y2="6" stroke="#000000" stroke-width="0.6" opacity="0.12"/>
      </pattern>

      <pattern id="pat-waffle-acc-006" width="8" height="8" patternUnits="userSpaceOnUse">
        <rect width="8" height="8" fill="none"/>
        <path d="M 0 0 L 8 0 L 8 8 L 0 8 Z" fill="none" stroke="#000000" stroke-width="0.75" opacity="0.15"/>
        <path d="M 2 2 L 6 2 L 6 6 L 2 6 Z" fill="#000000" opacity="0.08"/>
      </pattern>

      <pattern id="pat-knit-acc-006" width="10" height="12" patternUnits="userSpaceOnUse">
        <path d="M 2 0 Q 5 6 2 12 M 8 0 Q 5 6 8 12" fill="none" stroke="#000000" stroke-width="0.8" opacity="0.16"/>
      </pattern>

      <pattern id="pat-corduroy-acc-006" width="6" height="600" patternUnits="userSpaceOnUse">
        <rect x="0" y="0" width="3" height="600" fill="#FFFFFF" opacity="0.1"/>
        <rect x="3" y="0" width="3" height="600" fill="#000000" opacity="0.15"/>
      </pattern>
    </defs>

    <!-- Seamless Studio Backdrop -->
    <rect width="600" height="600" fill="#F5F3ED"/>
    <rect width="600" height="600" fill="url(#studio-pedestal-acc-006)"/>

    <!-- Dual Ground Contact Shadows -->
    <ellipse cx="300" cy="525" rx="180" ry="22" fill="#14110E" opacity="0.08" filter="blur(10px)"/>
    <ellipse cx="300" cy="522" rx="140" ry="14" fill="#14110E" opacity="0.16" filter="blur(4px)"/>
  
  
        <!-- High Horology Luxury Watch -->
        <g filter="url(#shadow-ambient-acc-006)">
          <rect x="272" y="130" width="56" height="340" rx="8" fill="#383F2F" stroke="#657056" stroke-width="2.5"/>
          <line x1="278" y1="140" x2="278" y2="460" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="3,3"/>
          <line x1="322" y1="140" x2="322" y2="460" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="3,3"/>

          
            <!-- Round Chronometer / Diver Case -->
            <circle cx="300" cy="300" r="75" fill="#E2DCD5" stroke="#D4AF37" stroke-width="6"/>
            <circle cx="300" cy="300" r="64" fill="#181512" stroke="#657056" stroke-width="2"/>
            <!-- Dial Markers & Hands -->
            <line x1="300" y1="242" x2="300" y2="256" stroke="#D4AF37" stroke-width="3"/>
            <line x1="300" y1="344" x2="300" y2="358" stroke="#D4AF37" stroke-width="3"/>
            <line x1="242" y1="300" x2="256" y2="300" stroke="#D4AF37" stroke-width="3"/>
            <line x1="344" y1="300" x2="358" y2="300" stroke="#D4AF37" stroke-width="3"/>
            <!-- Hands Pointing 10:10 Classic Watchmaker Pose -->
            <line x1="300" y1="300" x2="275" y2="270" stroke="#FFFFFF" stroke-width="3"/>
            <line x1="300" y1="300" x2="335" y2="280" stroke="#FFFFFF" stroke-width="2.5"/>
            <circle cx="300" cy="300" r="4" fill="#D4AF37"/>
          
        </g>
      
</svg>